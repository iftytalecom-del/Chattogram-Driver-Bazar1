name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the missing Android wrapper/platform scaffolding on GitHub's server.
      - name: Generate Android project
        run: flutter create --platforms=android --org com.chattogram --project-name driverbazar --no-pub build_app

      - name: Copy app source
        run: |
          cp -r lib build_app/
          cp pubspec.yaml build_app/
          if [ -f analysis_options.yaml ]; then cp analysis_options.yaml build_app/; fi

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chattogram-driver-bazar-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
